[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudlens"
version = "0.1.0"
description = "CloudLens: Enterprise Multi-Cloud Governance, Service Inventory, Pricing and Cost Management Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jyotirmoy Bhowmik", email = "admin@jyotirmoyb.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "prometheus-client>=0.20.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.1",
    "pre-commit>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "workers*", "connectors*", "domain*", "normalisation*", "masterdata*", "db*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "web",
    "db/migrations/versions"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (needed for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["api", "workers", "connectors", "domain", "normalisation", "masterdata", "db"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["web", ".venv", "db/migrations"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "level01: Level 1 Unit Tests (deterministic units, mathematical rules, and threshold bands)",
    "level02: Level 2 Integration Tests (real database repository lifecycle, schema validation)",
    "level03: Level 3 API Contract Tests (REST API envelopes, response headers, error representations)",
    "level04: Level 4 Connector Tests (dual-mode connector test kit)",
    "level05: Level 5 Cloud-Provider Tests (AWS, Azure, GCP, and OCI hierarchy and schema compatibility)",
    "level06: Level 6 Data Validation Tests (4-state null discipline)",
    "level07: Level 7 Cost Reconciliation Tests (100% hand-calculated coverage for tiered, commitments, discounts, currency)",
    "level08: Level 8 Security & Isolation Tests (OIDC login, token kill, break-glass, cross-tenant boundary isolation)",
    "level09: Level 9 RBAC Matrix Tests (role permissions, financial detail redaction, non-disclosure)",
    "level10: Level 10 Performance Benchmarks (MVP and design-headroom streaming with zero drift)",
    "level11: Level 11 Load & Stress Tests (concurrent ingestion and query stress)",
    "level12: Level 12 UI Contract Tests (inventory, lateral lenses, explanation panels, alerts)",
    "level13: Level 13 End-to-End Business Processes (BP-01 through BP-26)",
    "level14: Level 14 Disaster Recovery Exercise (automated restore, failover, RTO, RPO)",
    "level15: Level 15 Rolling Upgrade Tests (zero-downtime rolling upgrade on active dataset)",
    "level16: Level 16 Regression & Defect Prevention Tests (bi-temporal restatements, leap year, no float drift)",
    "level17: Level 17 Acceptance Quality Gates (full suite passing, 100% monetary coverage, zero float math)",
    "level18: Level 18 Master-Data Integrity Suite (bidirectional enum parity, zero orphan master values)",
    "level19: Level 19 Workflow & Approval Engine Suite (role/ownership approver resolution, delegation, atomic apply/reversion)",
    "level20: Level 20 Analytical Extract Suite (full partition restatements, scope manifests with SHA-256)",
    "phase2: Phase 2 / Addendum B (Prompts 57-61 / S-21 to S-27 improvements and integrations)",
]


