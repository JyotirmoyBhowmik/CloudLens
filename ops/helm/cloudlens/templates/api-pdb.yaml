{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudlens.fullname" . }}-api
  labels:
    {{- include "cloudlens.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "cloudlens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
