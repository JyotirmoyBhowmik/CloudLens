apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudlens.fullname" . }}-config
  labels:
    {{- include "cloudlens.labels" . | nindent 4 }}
data:
  CLOUDLENS_ENV: {{ .Values.global.environment | default "production" | quote }}
  CLOUDLENS_SECRET_BACKEND: {{ .Values.external.openbao.backendType | default "vault" | quote }}
  VAULT_ADDR: {{ .Values.external.openbao.address | quote }}
  VAULT_AUTH_METHOD: {{ .Values.external.openbao.authMethod | default "kubernetes" | quote }}
  VAULT_K8S_ROLE: {{ .Values.serviceAccounts.openbaoRolePrefix | default "cloudlens" }}-api
  OPENBAO_SECRET_PATH_DB: {{ .Values.external.openbao.databaseSecretPath | quote }}
  OPENBAO_SECRET_PATH_REDIS: {{ .Values.external.openbao.redisSecretPath | quote }}
  OPENBAO_SECRET_PATH_MINIO: {{ .Values.external.openbao.minioSecretPath | quote }}
  OPENBAO_SECRET_PATH_IDP: {{ .Values.external.openbao.idpSecretPath | quote }}
  OPENBAO_SECRET_PATH_SMTP: {{ .Values.external.openbao.smtpSecretPath | quote }}
  POSTGRES_HOST: {{ .Values.external.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.external.postgres.port | default 5432 | quote }}
  POSTGRES_DB: {{ .Values.external.postgres.database | quote }}
  REDIS_HOST: {{ .Values.external.redis.host | quote }}
  REDIS_PORT: {{ .Values.external.redis.port | default 6379 | quote }}
  MINIO_ENDPOINT: {{ .Values.external.minio.endpoint | quote }}
  MINIO_BUCKET: {{ .Values.external.minio.bucket | quote }}
  IDP_ISSUER_URL: {{ .Values.external.idp.issuerUrl | quote }}
  IDP_CLIENT_ID: {{ .Values.external.idp.clientId | quote }}
  SMTP_HOST: {{ .Values.external.smtp.host | quote }}
  SMTP_PORT: {{ .Values.external.smtp.port | default 587 | quote }}
