# UAT Environment values for CloudLens Helm chart (Option A: k3s/RKE2 on UAT VM)
# ZERO SECRETS — OpenBao paths and external cluster references only

global:
  environment: uat
  imageRegistry: ghcr.io/cloudlens
  imagePullSecrets:
    - name: regcred

nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 2
  image:
    repository: ghcr.io/cloudlens/api
    tag: 0.1.0-uat
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

web:
  replicaCount: 2
  image:
    repository: ghcr.io/cloudlens/web
    tag: 0.1.0-uat
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  image:
    repository: ghcr.io/cloudlens/worker
    tag: 0.1.0-uat
    pullPolicy: IfNotPresent
  pools:
    ingestion:
      enabled: true
      replicaCount: 2
      queue: ingestion
      concurrency: 4
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
    evaluation:
      enabled: true
      replicaCount: 2
      queue: evaluation
      concurrency: 4
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
    reporting:
      enabled: true
      replicaCount: 1
      queue: reporting
      concurrency: 2
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 512Mi

beat:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

hooks:
  migrate:
    enabled: true
    hook: "pre-install,pre-upgrade"
    hookWeight: -1
  bootstrap:
    enabled: true
    hook: "post-install"
  superuser:
    enabled: true
    hook: "post-install"

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: uat.cloudlens.jyotirmoyb.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: cloudlens-uat-tls-cert
      hosts:
        - uat.cloudlens.jyotirmoyb.com

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  prometheusNamespace: monitoring

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

serviceAccounts:
  openbaoRolePrefix: cloudlens-uat

# External Dependencies by Reference Only (ZERO Secrets - OpenBao Paths Only)
external:
  openbao:
    address: "http://openbao.security.svc.cluster.local:8200"
    backendType: "vault"
    authMethod: "kubernetes"
    mountPath: "secret"
    databaseSecretPath: "secret/data/cloudlens/uat/database"
    redisSecretPath: "secret/data/cloudlens/uat/redis"
    minioSecretPath: "secret/data/cloudlens/uat/minio"
    idpSecretPath: "secret/data/cloudlens/uat/idp"
    smtpSecretPath: "secret/data/cloudlens/uat/smtp"
  postgres:
    host: "cloudlens-uat-pg-cluster-rw.postgres.svc.cluster.local"
    port: 5432
    database: "cloudlens_uat"
    cnpgClusterName: "cloudlens-uat-pg-cluster"
  redis:
    host: "redis-master.cache.svc.cluster.local"
    port: 6379
  minio:
    endpoint: "http://minio.storage.svc.cluster.local:9000"
    bucket: "cloudlens-enterprise-uat"
  idp:
    issuerUrl: "https://idp.jyotirmoyb.com/realms/cloudlens"
    clientId: "cloudlens-uat-client"
  smtp:
    host: "mailpit.tools.svc.cluster.local"
    port: 1025

backups:
  cnpg:
    enabled: true
    schedule: "0 0 * * *"
    retentionPolicy: "35d"
    destinationPath: "s3://cloudlens-backups-uat/postgres/"
  openbaoSnapshot:
    enabled: true
    schedule: "0 2 * * *"
    destinationBucket: "cloudlens-backups-uat"
  velero:
    enabled: true
    schedule: "0 3 * * *"
    ttl: "840h0m0s"
