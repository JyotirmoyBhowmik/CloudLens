# Default values for CloudLens Helm chart.
# Declare variables to be passed into your templates.

global:
  environment: production
  imageRegistry: ghcr.io/cloudlens
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 2
  image:
    repository: ghcr.io/cloudlens/api
    tag: 0.1.0
    digest: "sha256:d8a9e0f1a4e27f6c31a780b62140e94bb512df8b10f8546b3e7bc2a6d4512345"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

web:
  replicaCount: 2
  image:
    repository: ghcr.io/cloudlens/web
    tag: 0.1.0
    digest: "sha256:f5e1b2c3d4a5890123456789abcdef0123456789abcdef0123456789abcdef01"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  image:
    repository: ghcr.io/cloudlens/worker
    tag: 0.1.0
    digest: "sha256:a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcdef0"
    pullPolicy: IfNotPresent
  pools:
    ingestion:
      enabled: true
      replicaCount: 2
      queue: ingestion
      concurrency: 4
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
    evaluation:
      enabled: true
      replicaCount: 2
      queue: evaluation
      concurrency: 4
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 800m
          memory: 1024Mi
    reporting:
      enabled: true
      replicaCount: 1
      queue: reporting
      concurrency: 2
      resources:
        requests:
          cpu: 150m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

beat:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

jobs:
  migrate:
    enabled: true
    hook: "pre-install,pre-upgrade"
  bootstrap49a:
    enabled: true
    hook: "post-install"
  superuser49b:
    enabled: true
    hook: "post-install"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: cloudlens.internal
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: cloudlens-tls
      hosts:
        - cloudlens.internal

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  prometheusNamespace: monitoring

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

serviceAccounts:
  openbaoRolePrefix: cloudlens

# External Dependencies by Reference Only (ZERO Secrets - OpenBao Paths Only)
external:
  openbao:
    address: "http://openbao.security.svc.cluster.local:8200"
    backendType: "vault"
    authMethod: "kubernetes"
    mountPath: "secret"
    databaseSecretPath: "secret/data/cloudlens/database"
    redisSecretPath: "secret/data/cloudlens/redis"
    minioSecretPath: "secret/data/cloudlens/minio"
    idpSecretPath: "secret/data/cloudlens/idp"
    smtpSecretPath: "secret/data/cloudlens/smtp"
  postgres:
    host: "cloudlens-pg-cluster-rw.postgres.svc.cluster.local"
    port: 5432
    database: "cloudlens"
    cnpgClusterName: "cloudlens-pg-cluster"
  redis:
    host: "redis-sentinel.cache.svc.cluster.local"
    port: 26379
  minio:
    endpoint: "http://minio.storage.svc.cluster.local:9000"
    bucket: "cloudlens-data"
  idp:
    issuerUrl: "https://keycloak.auth.svc.cluster.local/realms/cloudlens"
    clientId: "cloudlens-platform"
  smtp:
    host: "smtp-relay.messaging.svc.cluster.local"
    port: 587

backups:
  cnpg:
    enabled: true
    schedule: "0 0 * * *"
    retentionPolicy: "35d"
    destinationPath: "s3://cloudlens-backups/postgres/"
  openbaoSnapshot:
    enabled: true
    schedule: "0 2 * * *"
    destinationBucket: "cloudlens-backups"
  velero:
    enabled: true
    schedule: "0 3 * * *"
    ttl: "840h0m0s"
