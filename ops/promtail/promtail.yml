server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cloudlens_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: cloudlens
          __path__: /var/log/cloudlens/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            tenant_id: tenant_id
            correlation_id: correlation_id
      - labels:
          level:
          service:
          tenant: tenant_id
          correlation_id:
