name: Build, SBOM and Cosign Sign Multi-Arch Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-sbom-sign:
    name: Build Multi-Arch, Syft SBOM & Cosign Sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, web, worker]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ops/docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Syft CLI
        uses: anchore/sbom-action/download-syft@v0.17.0

      - name: Generate SPDX SBOM with Syft
        run: |
          mkdir -p ops/sbom
          syft "${{ env.IMAGE_BASE }}/${{ matrix.component }}@${{ steps.build-push.outputs.digest }}" \
            -o spdx-json=ops/sbom/${{ matrix.component }}.spdx.json

      - name: Install Cosign CLI
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Image with Cosign (Keyless Sigstore OIDC)
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_BASE }}/${{ matrix.component }}@${{ steps.build-push.outputs.digest }}"

      - name: Attach and Sign SBOM Attestation
        run: |
          cosign attest --yes \
            --predicate ops/sbom/${{ matrix.component }}.spdx.json \
            --type spdx \
            "${{ env.IMAGE_BASE }}/${{ matrix.component }}@${{ steps.build-push.outputs.digest }}"
