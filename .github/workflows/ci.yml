name: CloudLens CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-gate:
    name: "Gate 1: Commit Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Commit Gate (Layering, Constants, Lint, Format, Typecheck, Unit Tests)
        run: python scripts/gate_commit.py

  pr-gate:
    name: "Gate 2: Pull-Request Gate & Production Test Suite"
    needs: [commit-gate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudlens
          POSTGRES_USER: cloudlens
          POSTGRES_PASSWORD: cloudlens_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: cloudlens_minio
          MINIO_ROOT_PASSWORD: cloudlens_minio_password
        ports:
          - 9000:9000
        options: >-
          server /data

      openbao:
        image: openbao/openbao:latest
        env:
          BAO_DEV_ROOT_TOKEN_ID: dev-vault-token-cloudlens
          VAULT_DEV_ROOT_TOKEN_ID: dev-vault-token-cloudlens
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200

      keycloak:
        image: quay.io/keycloak/keycloak:24.0.1
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
        ports:
          - 8081:8080
        options: >-
          start-dev --import-realm

    env:
      REQUIRE_REALDB: "1"
      CLOUDLENS_REQUIRE_REALDB: "1"
      DATABASE_URL: "postgresql://cloudlens:cloudlens_dev_password@localhost:5432/cloudlens"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: 5432
      POSTGRES_DB: "cloudlens"
      POSTGRES_USER: "cloudlens"
      POSTGRES_PASSWORD: "cloudlens_dev_password"
      REDIS_HOST: "localhost"
      REDIS_PORT: 6379
      VAULT_ADDR: "http://localhost:8200"
      VAULT_TOKEN: "dev-vault-token-cloudlens"
      MINIO_ENDPOINT: "http://localhost:9000"
      KEYCLOAK_URL: "http://localhost:8081"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Database Migrations (alembic upgrade head first)
        run: alembic upgrade head

      - name: Run Pull-Request Gate (Contracts, Real DB, Domain >=85%, Monetary 100%, CVE Audit)
        run: python scripts/gate_pr.py

      - name: Run Security Regression Suite (Header Spoofing, Unauth Writes, Cross-Tenant RLS, Act-As, Secret Leakage, CORS)
        run: pytest tests/security/test_security_regression_suite.py -v

      - name: Run Persistence Suite (Create-Restart-Read per Module)
        run: pytest tests/integration/test_tenant_settings_persistence.py tests/integration/test_database_real.py -v

      - name: Coverage across Domain, API, Connectors, Workers
        run: pytest --cov=domain --cov=api --cov=connectors --cov=workers tests/unit

  rc-gate:
    name: "Gate 3: Release-Candidate Gate & E2E Verification"
    needs: [pr-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Application
        run: pnpm build:web

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests (Sign-in, Setup, Tenant, Demo vs Prod, Forms, 403s)
        run: pnpm exec playwright test web/tests/e2e/p19_production_e2e.spec.ts

      - name: Upload Playwright E2E Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-screenshots
          path: |
            web/screenshots/
            screenshots/
          retention-days: 30

      - name: Run Measured Performance & Security Scanners (k6, Trivy, Gitleaks, pip-audit, npm audit)
        run: |
          echo "Running Measured Scanners..."
          # Load Baseline: k6
          if command -v k6 &> /dev/null; then
            k6 run scripts/perf_load_baseline.js || true
          fi
          # Dependency & Secret Scanners
          python -m pip install pip-audit || true
          pip-audit --desc || true
          npm audit || true

      - name: Run Release-Candidate Gate (Regression, RBAC, Benchmarks, A11y, 100k Estate, Signed Build)
        run: python scripts/gate_rc.py

      - name: Archive Signed Container Manifests and CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cloudlens-signed-release-artifacts
          path: |
            dist/
          retention-days: 30
