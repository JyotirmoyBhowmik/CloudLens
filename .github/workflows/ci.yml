name: CloudLens CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-gate:
    name: "Gate 1: Commit Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Commit Gate (Layering, Constants, Lint, Format, Typecheck, Unit Tests)
        run: python scripts/gate_commit.py

  pr-gate:
    name: "Gate 2: Pull-Request Gate"
    needs: [commit-gate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudlens
          POSTGRES_USER: cloudlens
          POSTGRES_PASSWORD: cloudlens_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pull-Request Gate (Contracts, Real DB, Domain >=85%, Monetary 100%, CVE Audit)
        env:
          DATABASE_URL: "postgresql://cloudlens:cloudlens_dev_password@localhost:5432/cloudlens"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: 5432
          POSTGRES_DB: "cloudlens"
          POSTGRES_USER: "cloudlens"
          POSTGRES_PASSWORD: "cloudlens_dev_password"
        run: python scripts/gate_pr.py

  rc-gate:
    name: "Gate 3: Release-Candidate Gate"
    needs: [pr-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Application
        run: pnpm build:web

      - name: Run Release-Candidate Gate (Regression, RBAC, Benchmarks, A11y, 100k Estate, Signed Build)
        run: python scripts/gate_rc.py

      - name: Archive Signed Container Manifests and CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cloudlens-signed-release-artifacts
          path: |
            dist/
          retention-days: 30
